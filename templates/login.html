{% extends 'base.html' %}

{% block title %}Log In - StudyMate{% endblock %}

{% block content %}
<div class="container py-5 my-3">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="form-card shadow-lg">
                <div class="form-card-header text-center py-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.4rem;">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h3 class="fw-bold mb-1 text-white">Welcome Back</h3>
                    <p class="text-light opacity-75 small mb-0">Sign in to your StudyMate account</p>
                </div>

                <div class="form-card-body p-4 p-md-5">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label-modern">
                                <span><i class="fas fa-user text-muted me-1"></i> Username</span>
                            </label>
                            <input type="text" class="form-control-modern" id="username" name="username" placeholder="Enter your username" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label-modern">
                                <span><i class="fas fa-key text-muted me-1"></i> Password</span>
                            </label>
                            <input type="password" class="form-control-modern" id="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn-primary-modern mb-3">
                            <i class="fas fa-sign-in-alt"></i> Sign In
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top">
                        <p class="small text-muted mb-0">
                            Don't have an account? <a href="{% url 'signup' %}" class="fw-bold text-primary">Create an account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
